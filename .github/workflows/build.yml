name: Build and test Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Package portable ZIP
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BongoClaim-windows
          path: |
            artifacts/BongoClaim-v1.1.0-windows.zip
            artifacts/BongoClaim-v1.1.0-windows.zip.sha256
          if-no-files-found: error
